name: Metrics

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Use PAT if provided, otherwise fallback to GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN || github.token }}

          # Commit generated SVG into the repository
          committer_token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_branch: main

          filename: metrics.svg
          user: montaana01
          template: classic

          # Base sections
          base: header, activity, community, repositories

          # Timezone
          config_timezone: Europe/Vilnius

          # Plugins (safe, "good looking", and informative)
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes
          plugin_followup: yes
          plugin_reactions: yes
