name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_branch: main
          filename: metrics.svg

          user: montaana01
          template: classic
          config_timezone: Europe/Vilnius

          base: header, activity, community, repositories

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes
          plugin_followup: yes
          plugin_reactions: yes

      - name: Generate metrics.languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_branch: main
          filename: metrics.languages.svg

          user: montaana01
          template: classic
          config_timezone: Europe/Vilnius

          base: 0
          plugin_languages: yes
          plugin_languages_limit: 12
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      - name: Generate metrics.calendar.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_branch: main
          filename: metrics.calendar.svg

          user: montaana01
          template: classic
          config_timezone: Europe/Vilnius

          base: 0
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
